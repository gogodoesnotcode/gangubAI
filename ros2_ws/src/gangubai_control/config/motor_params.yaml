# Motor controller parameters for L298N on Raspberry Pi
# Adjust GPIO pins to match your wiring

motor_controller:
  ros__parameters:
    # ── Left motor (Motor A) ──
    ena_pin: 12       # PWM enable pin (BCM numbering)
    in1_pin: 23       # direction pin 1
    in2_pin: 24       # direction pin 2

    # ── Right motor (Motor B) ──
    enb_pin: 13       # PWM enable pin (BCM numbering)
    in3_pin: 27       # direction pin 1
    in4_pin: 22       # direction pin 2

    # ── Motor settings ──
    pwm_freq: 1000          # PWM frequency in Hz
    max_speed: 100.0        # max duty cycle %  (0-100)
    default_speed: 70.0     # duty cycle % used by string commands
    cmd_vel_timeout: 0.5    # seconds without cmd_vel before auto-stop
    simulate: false         # set true to run without GPIO hardware
